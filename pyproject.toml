[project]
name = "waste-sorting-mlops"
version = "0.6.0"
description = "Détection de déchets et aide au tri sélectif"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "api/tests"]
pythonpath = [".", "api"]

[tool.ruff.lint.per-file-ignores]
# Scripts d'entraînement suivis par DVC : les modifier change leur empreinte dans dvc.lock
# et relancerait les entraînements. Règles strictes pour le code de l'application seulement.
"ml/**" = ["E501", "E741", "B905"]

[tool.ruff.format]
exclude = ["ml/**"]

[tool.ruff.lint.isort]
known-first-party = ["app", "waste_core"]