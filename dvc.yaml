stages:
  prepare_trashnet:
    cmd: python ml/src/data/prepare_trashnet.py
    deps:
      - ml/src/data/prepare_trashnet.py
      - ml/data/raw/trashnet
    params:
      - seed
      - trashnet
    outs:
      - ml/data/processed/trashnet
    metrics:
      - ml/reports/trashnet_split.json:
          cache: false
  prepare_roboflow:
    cmd: python ml/src/data/prepare_roboflow.py
    deps:
      - ml/src/data/prepare_roboflow.py
      - ml/data/raw/roboflow
    params:
      - seed
      - roboflow
    outs:
      - ml/data/processed/roboflow
    metrics:
      - ml/reports/roboflow_split.json:
          cache: false     

    
  train_cls:
    cmd: python ml/src/train/train_cls.py --model resnet18_ft
    deps:
      - ml/src/train/train_cls.py
      - ml/data/processed/trashnet
    params:
      - ml/configs/train_cls.yaml:
          - seed
          - class_weights
          - models.resnet18_ft
    outs:
      - ml/models/cls_resnet18_ft.pt
    metrics:
      - ml/reports/cls_resnet18_ft.json:
          cache: false
    plots:
      - ml/reports/cls_resnet18_ft_confusion.png:
          cache: false 
  
  train_yolo:
    cmd: python ml/src/train/train_yolo.py --config ml/configs/train_yolo_640.yaml
    deps:
      - ml/src/train/train_yolo.py
      - ml/data/processed/roboflow
    params:
      - ml/configs/train_yolo_640.yaml:
          - seed
          - model
          - imgsz
          - epochs
          - batch
          - patience
    outs:
      - ml/models/yolo_yolov8n_640.pt
    metrics:
      - ml/reports/yolo_yolov8n_640.json:
          cache: false        