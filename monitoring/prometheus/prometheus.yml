# Prometheus vient lire /metrics de l'API toutes les 5 secondes et garde l'historique.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertes.yml

scrape_configs:
  - job_name: ecotri-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"] # "api" = le nom du service dans docker-compose.yml